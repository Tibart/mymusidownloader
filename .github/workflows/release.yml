name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build
        run: GOOS=linux GOARCH=arm64 go build -o mymusidownloader ./cmd/mymusidownloader
      - uses: actions/upload-artifact@v4
        with:
          name: mymusidownloader-linux-arm64
          path: mymusidownloader
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mymusidownloader
